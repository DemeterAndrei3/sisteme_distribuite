<!DOCTYPE html><html lang="ro" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Comenzile mele</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="container page"><p class="eyebrow">ISTORIC</p><h1>Comenzile mele</h1><div class="table-wrap"><table><thead><tr><th>Număr</th><th>Data</th><th>Status</th><th>Total</th></tr></thead><tbody><tr th:each="o : ${orders}"><td th:text="'#' + ${o.id}"></td><td th:text="${#temporals.format(o.createdAt,'dd.MM.yyyy HH:mm')}"></td><td th:text="${o.status}"></td><td th:text="${o.total} + ' lei'"></td></tr></tbody></table></div><p th:if="${#lists.isEmpty(orders)}">Nu ai plasat încă nicio comandă.</p></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
