<!DOCTYPE html><html lang="ro" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalii produs</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="container detail"><img th:src="${product.imageUrl != null ? product.imageUrl : 'https://placehold.co/600x400'}" alt="Produs"><div><p class="eyebrow">DETALII PRODUS</p><h1 th:text="${product.name}">Produs</h1><p th:text="${product.description}"></p><h2 class="detail-price" th:text="${#numbers.formatDecimal(product.price,1,2)} + ' lei'"></h2><p th:text="'Disponibile: ' + ${product.stock}"></p><form th:action="@{/cart/add/{id}(id=${product.id})}" method="post"><button class="btn">Adaugă în coș</button></form></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
