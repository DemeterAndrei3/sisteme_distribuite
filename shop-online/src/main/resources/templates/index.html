<!DOCTYPE html><html lang="ro" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop Online</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments :: header}"></header>
<section class="hero"><div><p class="eyebrow">BINE AI VENIT ÎN MAGAZIN</p><h1>Produse utile.<br><span>Experiență simplă.</span></h1><p>Descoperă produse atent selectate și comandă online în câțiva pași.</p><a class="btn" href="#produse">Vezi produsele</a></div><div class="hero-art">SHOP<br>ONLINE</div></section>
<main id="produse" class="container"><div class="section-head"><div><p class="eyebrow">COLECȚIA NOASTRĂ</p><h2>Produse populare</h2></div><form action="/" method="get" class="search"><input name="q" placeholder="Caută un produs..." th:value="${q}"><button class="btn">Caută</button></form></div>
<div class="products"><article class="product-card" th:each="p : ${products}"><a th:href="@{/products/{id}(id=${p.id})}"><img th:src="${p.imageUrl != null and !p.imageUrl.isBlank() ? p.imageUrl : 'https://placehold.co/600x400?text=Shop+Online'}" alt="Produs"><div class="product-info"><h3 th:text="${p.name}">Produs</h3><p th:text="${p.description}">Descriere</p><div class="price-row"><strong th:text="${#numbers.formatDecimal(p.price,1,2)} + ' lei'">0 lei</strong><span th:text="'Stoc: ' + ${p.stock}">Stoc</span></div></div></a><form th:action="@{/cart/add/{id}(id=${p.id})}" method="post"><button class="btn btn-full" type="submit">Adaugă în coș</button></form></article></div>
<p class="empty" th:if="${#lists.isEmpty(products)}">Nu există produse care corespund căutării.</p></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
