<!DOCTYPE html><html lang="ro" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Autentificare</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="auth"><form class="panel" th:action="@{/login}" method="post"><p class="eyebrow">CONTUL TĂU</p><h1>Autentificare</h1><p th:if="${param.error}" class="error">Email sau parolă incorectă.</p><p th:if="${param.registered}" class="success">Cont creat. Te poți autentifica.</p><label>Email<input type="email" name="username" required></label><label>Parolă<input type="password" name="password" required></label><button class="btn btn-full">Intră în cont</button><p>Nu ai cont? <a href="/register">Înregistrează-te</a></p></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
