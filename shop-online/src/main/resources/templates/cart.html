<!DOCTYPE html><html lang="ro" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Coș</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="container page"><p class="eyebrow">COMANDA TA</p><h1>Coș de cumpărături</h1><div class="table-wrap"><table><thead><tr><th>Produs</th><th>Preț</th><th>Cantitate</th><th>Subtotal</th><th></th></tr></thead><tbody><tr th:each="i : ${items}"><td th:text="${i.product.name}"></td><td th:text="${i.product.price} + ' lei'"></td><td th:text="${i.quantity}"></td><td th:text="${i.product.price * i.quantity} + ' lei'"></td><td><form th:action="@{/cart/remove/{id}(id=${i.id})}" method="post"><button class="danger">Șterge</button></form></td></tr></tbody></table></div><div class="checkout"><h2 th:text="'Total: ' + ${#numbers.formatDecimal(total,1,2)} + ' lei'"></h2><form th:action="@{/checkout}" method="post"><button class="btn">Plasează comanda</button></form></div><p th:if="${#lists.isEmpty(items)}">Coșul este gol. <a href="/">Continuă cumpărăturile</a>.</p></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
