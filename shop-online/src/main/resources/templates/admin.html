<!DOCTYPE html><html lang="ro" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administrare</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="container page"><p class="eyebrow">ADMINISTRARE</p><h1>Panou administrator</h1><section class="panel admin-form"><h2>Adaugă produs</h2><form th:action="@{/admin/products}" method="post" class="form-grid"><label>Nume<input name="name" required></label><label>Preț (lei)<input name="price" type="number" step="0.01" min="0" required></label><label>Stoc<input name="stock" type="number" min="0" required></label><label>Adresă imagine<input name="imageUrl"></label><label class="wide">Descriere<textarea name="description"></textarea></label><button class="btn">Salvează produsul</button></form></section><h2>Produse existente</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Produs</th><th>Preț</th><th>Stoc</th><th>Acțiune</th></tr></thead><tbody><tr th:each="p : ${products}"><td th:text="${p.id}"></td><td th:text="${p.name}"></td><td th:text="${p.price}"></td><td th:text="${p.stock}"></td><td><form th:action="@{/admin/products/delete/{id}(id=${p.id})}" method="post"><button class="danger">Șterge</button></form></td></tr></tbody></table></div><h2>Comenzi</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Client</th><th>Data</th><th>Total</th><th>Status</th></tr></thead><tbody><tr th:each="o : ${orders}"><td th:text="${o.id}"></td><td th:text="${o.user.name}"></td><td th:text="${o.createdAt}"></td><td th:text="${o.total}"></td><td th:text="${o.status}"></td></tr></tbody></table></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
